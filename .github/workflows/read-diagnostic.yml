# Manual read diagnostics. The default and the v2 rehearsal use only team fixtures.
# Private replay requires the reviewed receipt commitment in the pinned publisher.
name: read-diagnostic

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Select the reader diagnostic
        type: choice
        default: existing
        options:
          - existing
          - col0-v2-fixtures
          - col0-v2
          - col0-v3-fixtures
          - col0-v3-count

permissions:
  contents: read

jobs:
  diagnostic:
    if: inputs.diagnostic != 'col0-v2' && inputs.diagnostic != 'col0-v3-fixtures' && inputs.diagnostic != 'col0-v3-count'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - &checkout
        name: Check out the pinned diagnostic tools
        run: |
          set -eu
          git init -q "$RUNNER_TEMP/base"
          git -C "$RUNNER_TEMP/base" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/base" config remote.origin.promisor true
          git -C "$RUNNER_TEMP/base" sparse-checkout set --no-cone '/tools/' '/.github/'
          git -C "$RUNNER_TEMP/base" fetch -q --filter=blob:none --depth 1 origin "$GITHUB_SHA"
          git -C "$RUNNER_TEMP/base" checkout -q --detach FETCH_HEAD
      - name: Run the diagnostic on team-authored files
        if: inputs.diagnostic == 'existing' || inputs.diagnostic == ''
        run: bash "$RUNNER_TEMP/base/tools/read-diagnostic.sh" "$RUNNER_TEMP/base"
      - name: Rehearse the frozen v2 histogram on team files
        if: inputs.diagnostic == 'col0-v2-fixtures'
        run: |
          set -eu
          out="$RUNNER_TEMP/team-histogram"
          python3 -I -B -S "$RUNNER_TEMP/base/tools/read-col0-v2-replay.py" --team-fixtures > "$out"
          printf '%s\n' '[2,[5,5,5,5,5,5],-1]' | cmp -s - "$out"
          cat "$out"
  coverage_rehearsal:
    if: inputs.diagnostic == 'col0-v3-fixtures'
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - *checkout
      - name: Run the team coverage rehearsal
        run: python3 -I -B -S "$RUNNER_TEMP/base/tools/read-col0-v3.py" --team-fixtures

  coverage_preflight:
    if: >-
      inputs.diagnostic == 'col0-v3-count' && vars.COL0_V3_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' &&
      github.ref == vars.COL0_V3_TAG_REF && github.repository == vars.COL0_V3_REPOSITORY &&
      github.run_number == vars.COL0_V3_RUN_NUMBER && github.run_number > 2 && github.run_attempt == 1
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      authorized: ${{ steps.preflight.outputs.authorized }}
    env: &coverage_env
      COL0_V3_ENABLED: ${{ vars.COL0_V3_ENABLED }}
      COL0_V3_SELECTION: ${{ inputs.diagnostic }}
      COL0_V3_TAG_REF: ${{ vars.COL0_V3_TAG_REF }}
      COL0_V3_TAG_TYPE: ${{ vars.COL0_V3_TAG_TYPE }}
      COL0_V3_REPOSITORY: ${{ vars.COL0_V3_REPOSITORY }}
      COL0_V3_RUN_NUMBER: ${{ vars.COL0_V3_RUN_NUMBER }}
      COL0_V3_PEELED_COMMIT: ${{ vars.COL0_V3_PEELED_COMMIT }}
      COL0_V3_DESCRIPTOR: ${{ vars.COL0_V3_DESCRIPTOR }}
      COL0_V3_DESCRIPTOR_SHA256: ${{ vars.COL0_V3_DESCRIPTOR_SHA256 }}
    steps:
      - &coverage_checkout
        name: Resolve the reserved tag and check out the pinned tools
        id: pinned
        run: |
          set -eu
          case "$GITHUB_REF" in refs/tags/col0-v3-count-*) ;; *) exit 0 ;; esac
          base="$RUNNER_TEMP/base"
          if (
            set -e
            git init -q "$base" &&
            git -C "$base" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git" &&
            git -C "$base" config remote.origin.promisor true &&
            git -C "$base" sparse-checkout set --no-cone '/tools/' '/.github/' &&
            git -C "$base" fetch -q --no-tags --filter=blob:none --depth 1 origin "+$GITHUB_REF:$GITHUB_REF" &&
            git -C "$base" checkout -q --detach "$GITHUB_SHA"
          ) >/dev/null 2>&1; then
            printf 'ready=true\n' >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
      - name: Verify the descriptor without protected credentials
        if: steps.pinned.outputs.ready == 'true'
        id: preflight
        run: python3 -I -B -S "$RUNNER_TEMP/base/tools/read-col0-v3.py" --preflight

  coverage_reserved:
    needs: coverage_preflight
    if: >-
      needs.coverage_preflight.outputs.authorized == 'true' &&
      inputs.diagnostic == 'col0-v3-count' && vars.COL0_V3_ENABLED == 'true' &&
      github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' &&
      github.ref == vars.COL0_V3_TAG_REF && github.repository == vars.COL0_V3_REPOSITORY &&
      github.run_number == vars.COL0_V3_RUN_NUMBER && github.run_number > 2 && github.run_attempt == 1
    environment: col0-v3-count-private
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: *coverage_env
    steps:
      - *coverage_checkout
      - name: Verify the protected binding and count the reserved cohort
        if: steps.pinned.outputs.ready == 'true'
        env:
          COL0_V3_PROTECTED_DESCRIPTOR_SHA256: ${{ vars.COL0_V3_PROTECTED_DESCRIPTOR_SHA256 }}
          COL0_V3_PROTECTED_TAG_REF: ${{ vars.COL0_V3_PROTECTED_TAG_REF }}
          COL0_V3_PROTECTED_TAG_TYPE: ${{ vars.COL0_V3_PROTECTED_TAG_TYPE }}
          COL0_V3_PROTECTED_PEELED_COMMIT: ${{ vars.COL0_V3_PROTECTED_PEELED_COMMIT }}
          COL0_V3_BINDING: ${{ secrets.COL0_V3_BINDING }}
          COL0_V3_MANIFEST_1: ${{ secrets.COL0_V3_MANIFEST_1 }}
          COL0_V3_MANIFEST_2: ${{ secrets.COL0_V3_MANIFEST_2 }}
          COL0_V3_MANIFEST_3: ${{ secrets.COL0_V3_MANIFEST_3 }}
          COL0_V3_MANIFEST_4: ${{ secrets.COL0_V3_MANIFEST_4 }}
        run: python3 -I -B -S "$RUNNER_TEMP/base/tools/read-col0-v3.py" --reserved

  private:
    if: inputs.diagnostic == 'col0-v2' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: col0-v2-private
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - *checkout
      - name: Release the frozen private v2 histogram
        env:
          COL0_V2_RECEIPTS: ${{ github.sha == vars.COL0_V2_BASE && secrets.COL0_V2_RECEIPTS || '' }}
        run: python3 -I -B -S "$RUNNER_TEMP/base/tools/read-col0-v2-replay.py"
